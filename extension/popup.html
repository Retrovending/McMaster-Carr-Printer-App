<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand">Product → Label</div>
    <div id="partNo" class="pn"></div>
  </header>

  <div id="notPart" class="empty" hidden>
    Open a product page, or use the optional lookup below.
  </div>

  <div id="lookupStatus" role="status"></div>
  <details id="manualLookup">
    <summary>Optional: look up a product</summary>
  <form id="adLookup" class="field">
    <label for="adQuery">Product link or part number</label>
    <input id="adQuery" required>
    <button id="lookup" type="submit">Look up product</button>
  </form>
  </details>
  <main id="main" hidden>
    <fieldset id="attributePanel" hidden>
      <legend>Attributes to print</legend>
      <div id="attributes"></div>
      <p>Selections are remembered per product on this computer. Long text is shortened with … on the label; check the preview.</p>
    </fieldset>
    <div class="preview-wrap"><canvas id="preview"></canvas></div>
    <div id="previewSize" class="preview-size"></div>
    <button id="customize" type="button">Customize — drag and resize</button>
    <fieldset id="elementControls" hidden>
      <legend>Element size and position</legend>
      <label class="field">Element<select id="elementSelect"></select></label>
      <label class="field" for="elementScale">Size <output id="elementPercent">100%</output></label>
      <input id="elementScale" type="range" min="40" max="250" step="5" value="100">
      <button id="resetDesign" type="button">Reset arrangement</button>
      <p id="editorHint"></p>
    </fieldset>

    <label class="field">
      <span id="descLabel">Description</span>
      <textarea id="desc" rows="3"></textarea>
    </label>

    <div class="row">
      <label class="field grow">
        <span>Label</span>
        <select id="size"></select>
      </label>
      <label class="field copies">
        <span>Copies</span>
        <input id="copies" type="number" min="1" max="99" value="1">
      </label>
    </div>

    <label class="field">
      <span>Layout</span>
      <select id="layout"></select>
    </label>

    <div class="row">
      <label class="field grow">
        <span>Printer</span>
        <select id="printer"><option value="">Looking for DYMO Connect…</option></select>
      </label>
      <div class="picbox">
        <label class="check">
          <input id="showImage" type="checkbox" checked> Picture
        </label>
        <div id="imgNav" class="imgnav" hidden>
          <button id="imgPrev" type="button" title="Previous picture">◀</button>
          <span id="imgCount"></span>
          <button id="imgNext" type="button" title="Next picture">▶</button>
        </div>
      </div>
    </div>

    <button id="print" class="primary">Print label</button>
    <div id="status" class="status"></div>
  </main>

  <script src="lib/qrcode.js"></script>
  <script src="label.js"></script>
  <script src="dymo.js"></script>
  <script src="printing.js"></script>
  <script src="extract.js"></script>
  <script src="automationdirect.js"></script>
  <script src="popup.js"></script>
</body>
</html>
